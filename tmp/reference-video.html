<!doctype html>
<html>
  <head>
    <meta charset="utf-8" />
    <style>
      html, body { margin: 0; width: 100%; height: 100%; overflow: hidden; background: #111; }
      video { width: 100%; height: 100%; object-fit: contain; }
    </style>
  </head>
  <body>
    <video id="reference" muted autoplay src="file:///C:/Users/Karan%20Talekar.Karan/OneDrive/Videos/Screen%20Recordings/Screen%20Recording%202026-07-13%20224914.mp4"></video>
    <script>
      const video = document.getElementById("reference");
      video.addEventListener("loadedmetadata", () => {
        video.currentTime = Math.min(3, Math.max(0, video.duration / 3));
      });
      video.addEventListener("seeked", () => video.pause());
    </script>
  </body>
</html>
